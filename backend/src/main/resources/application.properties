spring.application.name=smart-crop-backend
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:5000}

spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:90d}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.ml-service-url=${ML_SERVICE_URL:http://127.0.0.1:8000}

server.error.include-message=always
